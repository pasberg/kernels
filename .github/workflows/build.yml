name: Bygg index.html

on:
  push:
    branches: [main]
    paths:
      - "karnor.html"
      - "src/**"
      - "build.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bygg
        run: python3 build.py
      - name: Committa index.html om den ändrats
        run: |
          if [ -n "$(git status --porcelain index.html)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "Bygg index.html"
            git push
          fi
